<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cheap Train Getaways from the Netherlands</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen">

    <!-- Header -->
    <header class="bg-blue-600 text-white py-8 shadow-md">
        <div class="max-w-4xl mx-auto px-4 text-center">
            <h1 class="text-3xl font-bold">🇳🇱 Cheap Train Getaways from NL</h1>
            <p class="text-blue-100 mt-2">The top cheapest weekend train destinations, updated daily.</p>
        </div>
    </header>

    <!-- Main Content / Dynamic Deals Container -->
    <main class="max-w-4xl mx-auto px-4 py-8">
        <div id="deals-container" class="space-y-4">
            <!-- Loading state -->
            <p class="text-center text-slate-400 py-8">Loading live train deals...</p>
        </div>
    </main>

    <!-- Footer -->
    <footer class="text-center py-6 text-slate-400 text-sm">
        <p>Prices update automatically via GitHub Actions.</p>
    </footer>

    <!-- JavaScript to Fetch and Display JSON Data -->
    <script>
        async function loadDeals() {
            try {
                // Fetch the prices.json file we generated
                const response = await fetch('prices.json?t=' + Date.now());
                const deals = await response.json();

                // 1. Sort cheapest to most expensive
                deals.sort((a, b) => a.price - b.price);

                const container = document.getElementById('deals-container');
                container.innerHTML = ""; // Clear loading text

                // 2. Loop through the sorted deals and build HTML cards
                deals.forEach((deal, index) => {
                    const badge = index === 0 ? '<span class="bg-green-100 text-green-800 text-xs font-semibold px-2.5 py-0.5 rounded">#1 Cheapest</span>' : `<span class="text-xs font-semibold px-2.5 py-0.5 rounded bg-slate-100 text-slate-600">#${index + 1}</span>`;

                    const card = `
                        <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 flex flex-col sm:flex-row justify-between items-center gap-4">
                            <div>
                                ${badge}
                                <h2 class="text-xl font-bold mt-1">${deal.destination}</h2>
                                <p class="text-slate-500 text-sm">Direct / Fast connection • ~${deal.duration}</p>
                            </div>
                            <div class="text-center sm:text-right flex items-center gap-4">
                                <div>
                                    <span class="text-xs text-slate-400 block">Return from</span>
                                    <span class="text-2xl font-bold text-blue-600">€${deal.price}</span>
                                </div>
                                <a href="${deal.link}" target="_blank" class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-5 py-2.5 rounded-lg transition">
                                    Book Ticket
                                </a>
                            </div>
                        </div>
                    `;
                    container.innerHTML += card;
                });

            } catch (error) {
                console.error("Error loading deals:", error);
                document.getElementById('deals-container').innerHTML = '<p class="text-center text-red-500">Could not load current train deals. Please check back later.</p>';
            }
        }

        // Run the function when the page opens
        loadDeals();
    </script>

</body>
</html>
