<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Train Getaways from NL</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen p-6">
    <div class="max-w-4xl mx-auto">
        <header class="text-center mb-8">
            <h1 class="text-3xl font-extrabold text-blue-900 tracking-tight">Weekend Train Getaways 🚄</h1>
            <p class="text-slate-600 mt-1">Cheapest upcoming weekend fares from <span class="font-semibold text-slate-800">Amsterdam Centraal</span></p>
        </header>

        <!-- Horizon Tabs -->
        <div class="flex justify-center gap-3 mb-8">
            <button onclick="switchHorizon('next_weekend')" id="btn-next_weekend" class="px-5 py-2.5 rounded-xl font-semibold shadow-sm transition bg-blue-600 text-white">Next Weekend</button>
            <button onclick="switchHorizon('two_weeks')" id="btn-two_weeks" class="px-5 py-2.5 rounded-xl font-semibold shadow-sm transition bg-white text-slate-700 hover:bg-slate-100 border border-slate-200">In 2 Weeks</button>
            <button onclick="switchHorizon('next_month')" id="btn-next_month" class="px-5 py-2.5 rounded-xl font-semibold shadow-sm transition bg-white text-slate-700 hover:bg-slate-100 border border-slate-200">Next Month</button>
        </div>

        <!-- Cards Container -->
        <div id="deals-container" class="grid gap-4 md:grid-cols-2 lg:grid-cols-3">
            <!-- Dynamically populated -->
        </div>
    </div>

    <script>
        let allData = {};
        let currentHorizon = 'next_weekend';

        async function fetchPrices() {
            try {
                const response = await fetch('prices.json?t=' + Date.now());
                allData = await response.json();
                renderDeals(currentHorizon);
            } catch (error) {
                console.error("Failed to load prices:", error);
            }
        }

        function switchHorizon(horizon) {
            currentHorizon = horizon;
            
            ['next_weekend', 'two_weeks', 'next_month'].forEach(h => {
                const btn = document.getElementById(`btn-${h}`);
                if (h === horizon) {
                    btn.className = "px-5 py-2.5 rounded-xl font-semibold shadow-sm transition bg-blue-600 text-white";
                } else {
                    btn.className = "px-5 py-2.5 rounded-xl font-semibold shadow-sm transition bg-white text-slate-700 hover:bg-slate-100 border border-slate-200";
                }
            });

            renderDeals(horizon);
        }

        function renderDeals(horizon) {
            const container = document.getElementById('deals-container');
            container.innerHTML = '';
            
            const deals = allData[horizon] || [];
            
            deals.forEach(deal => {
                const card = document.createElement('div');
                card.className = "bg-white p-5 rounded-2xl shadow-sm border border-slate-200 flex flex-col justify-between hover:shadow-md transition";
                card.innerHTML = `
                    <div>
                        <div class="flex justify-between items-start mb-2">
                            <span class="text-xs font-bold uppercase tracking-wider text-blue-600 bg-blue-50 px-2.5 py-1 rounded-md">${deal.date}</span>
                            <span class="text-2xl font-black text-slate-900">€${deal.price}</span>
                        </div>
                        <h3 class="text-lg font-bold text-slate-800 mb-1">${deal.destination}</h3>
                        <p class="text-xs text-slate-400 mb-1">From: ${deal.origin || 'Amsterdam'}</p>
                        <p class="text-sm text-slate-500 mb-4">${deal.operator}</p>
                    </div>
                    <a href="${deal.link}" target="_blank" class="w-full text-center bg-slate-900 hover:bg-blue-600 text-white font-medium py-2 px-4 rounded-xl transition text-sm">
                        View Live Tickets &rarr;
                    </a>
                `;
                container.appendChild(card);
            });
        }

        fetchPrices();
    </script>
</body>
</html><!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cheap Train Getaways from the Netherlands</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen">

    <!-- Header -->
    <header class="bg-blue-600 text-white py-8 shadow-md">
        <div class="max-w-4xl mx-auto px-4 text-center">
            <h1 class="text-3xl font-bold">🇳🇱 Cheap Train Getaways from NL</h1>
            <p class="text-blue-100 mt-2">The top cheapest weekend train destinations, updated daily.</p>
        </div>
    </header>

    <!-- Main Content / Dynamic Deals Container -->
    <main class="max-w-4xl mx-auto px-4 py-8">
        <div id="deals-container" class="space-y-4">
            <!-- Loading state -->
            <p class="text-center text-slate-400 py-8">Loading live train deals...</p>
        </div>
    </main>

    <!-- Footer -->
    <footer class="text-center py-6 text-slate-400 text-sm">
        <p>Prices update automatically via GitHub Actions.</p>
    </footer>

    <!-- JavaScript to Fetch and Display JSON Data -->
    <script>
        async function loadDeals() {
            try {
                // Fetch the prices.json file we generated
                const response = await fetch('prices.json?t=' + Date.now());
                const deals = await response.json();

                // 1. Sort cheapest to most expensive
                deals.sort((a, b) => a.price - b.price);

                const container = document.getElementById('deals-container');
                container.innerHTML = ""; // Clear loading text

                // 2. Loop through the sorted deals and build HTML cards
                deals.forEach((deal, index) => {
                    const badge = index === 0 ? '<span class="bg-green-100 text-green-800 text-xs font-semibold px-2.5 py-0.5 rounded">#1 Cheapest</span>' : `<span class="text-xs font-semibold px-2.5 py-0.5 rounded bg-slate-100 text-slate-600">#${index + 1}</span>`;

                    const card = `
                        <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 flex flex-col sm:flex-row justify-between items-center gap-4">
                            <div>
                                ${badge}
                                <h2 class="text-xl font-bold mt-1">${deal.destination}</h2>
                                <p class="text-slate-500 text-sm">Direct / Fast connection • ~${deal.duration}</p>
                            </div>
                            <div class="text-center sm:text-right flex items-center gap-4">
                                <div>
                                    <span class="text-xs text-slate-400 block">Return from</span>
                                    <span class="text-2xl font-bold text-blue-600">€${deal.price}</span>
                                </div>
                                <a href="${deal.link}" target="_blank" class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-5 py-2.5 rounded-lg transition">
                                    Book Ticket
                                </a>
                            </div>
                        </div>
                    `;
                    container.innerHTML += card;
                });

            } catch (error) {
                console.error("Error loading deals:", error);
                document.getElementById('deals-container').innerHTML = '<p class="text-center text-red-500">Could not load current train deals. Please check back later.</p>';
            }
        }

        // Run the function when the page opens
        loadDeals();
    </script>

</body>
</html>
