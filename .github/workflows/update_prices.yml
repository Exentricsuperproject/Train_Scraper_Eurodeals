name: Daily Train Price Scraper

# 1. Set the schedule: Runs every day at 4:00 AM UTC
on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch: # Allows you to click a button to run it manually anytime!

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write # Gives the script permission to commit changes back to your repo

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run the scraper script
        run: python scraper.py

- name: Commit and push changes if prices updated
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add prices.json
          
          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No price changes to commit."
          else
            git commit -m "Auto-update train prices [skip ci]" || echo "Nothing to commit"
            
            # Pull with rebase, and if a conflict happens on prices.json, automatically accept our latest generated version
            git pull --rebase origin main -X theirs || {
              git checkout --theirs prices.json
              git add prices.json
              git rebase --continue || git rebase --abort
            }
            
            git push origin main
          fi
